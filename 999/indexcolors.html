<div id="carrosselRef" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-indicators">
      <button data-bs-target="#carrosselRef" data-bs-slide-to="0" class="active" aria-label="Slide 1"></button>
      <button data-bs-target="#carrosselRef" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button data-bs-target="#carrosselRef" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>

    <div class="carousel-inner">


      <div class="carousel-item active">
        <img

          class="d-block w-100"
          alt="Slide 1: Desenvolvimento Web">
        <!--
          carousel-caption: legenda sobreposta à imagem (posição absoluta)
          d-none d-md-block: esconde em mobile, exibe tablet+ (≥768px)
          Motivo: em telas pequenas a imagem fica comprimida e
          a legenda torna-se ilegível ou sobrepõe muito o conteúdo.
        -->
        <div class="carousel-caption d-none d-md-block">
          <h5>Desenvolvimento Web</h5>
          <p>Sites modernos e responsivos com IA.</p>
        </div>
      </div>

      <!-- SLIDE 2 -->
      <div class="carousel-item">
        <img
          src="https://placehold.co/900x300/6C63FF/ffffff?text=Slide+2+Design+com+IA"
          class="d-block w-100"
          alt="Slide 2: Design com IA">
        <div class="carousel-caption d-none d-md-block">
          <h5>Design com Inteligência Artificial</h5>
          <p>Layouts gerados e otimizados com IA.</p>
        </div>
      </div>

      <!-- SLIDE 3 -->
      <div class="carousel-item">

          src="https://placehold.co/900x300/003366/ffffff?text=Slide+3+Consultoria+Digital"

          alt="Slide 3: Consultoria Digital">
        <div class="carousel-caption d-none d-md-block">
          <h5>Consultoria Digital</h5>
          <p>Estratégia de presença digital para seu negócio.</p>
        </div>
      </div>

    </div><!-- /carousel-inner -->

    <button
      class="carousel-control-prev"
      data-bs-target="#carrosselRef"
      data-bs-slide="prev"
      aria-label="Slide anterior">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button
      class="carousel-control-next"
      data-bs-target="#carrosselRef"
      data-bs-slide="next"
      aria-label="Próximo slide">
      <span class="carousel-control-next-icon"></span>
